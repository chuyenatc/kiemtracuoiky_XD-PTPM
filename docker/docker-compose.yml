services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - hotel_room_uploads:/var/www/html/uploads/rooms
    environment:
      DB_HOST: db
      DB_NAME: hotel_mvc
      DB_USER: ${MYSQL_USER:-hotel_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in docker/.env}
      HOTEL_APP_URL: ${HOTEL_APP_URL:-}
      HOTEL_MAIL_FROM: ${HOTEL_MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hotel_mvc
      MYSQL_USER: ${MYSQL_USER:-hotel_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in docker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env}
    volumes:
      - hotel_mysql_data:/var/lib/mysql
      - ../database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  hotel_mysql_data:
  hotel_room_uploads:
